customer:
  role: dev
  message: This is Customer Service from new file
server:
  port: 8100

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/customer_service_database
    username: root
    password: ypatel
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
#spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Spring security
  security:
    user:
      name: ypatel
      password: ypatel
#Spring Redis Cache
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: registrationConfirmation:com.yash.banking.customer_webservices.notification.RegistrationNotificationRequest
#spring.data.redis.ssl.enabled=true
#spring.cache.redis.time-to-live=40000
#eureka client configuration
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka